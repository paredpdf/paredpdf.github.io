name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # One job per browser setup, all in parallel, inside Playwright's own
  # image: it has the browsers and their system libraries for this exact
  # Playwright version, so nothing is installed per run. WebKit is Safari's
  # engine, so its desktop and iPhone runs are the closest we get to iOS.
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root # Firefox needs a home it owns when running as root
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone, firefox, webkit, iphone]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The image's own browsers, not .browsers/ as the npm script uses locally.
      - run: npx playwright test --project=${{ matrix.project }}

  # Publishes the site once both test jobs pass, with the commit and deploy
  # time stamped into index.html. Needs Settings → Pages → Source set to
  # "GitHub Actions".
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/stamp.js "$GITHUB_SHA"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
